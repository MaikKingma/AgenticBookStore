# Test-only overrides of application.yml. Surefire activates the test profile for every test.
# Never add an application.yml to the test resources: it would shadow the main one.
spring:
  ai:
    anthropic:
      # Tests stay offline when the workshop key BOOKSTORE_AI_API_KEY is exported in the shell: a blank key switches
      # the chat model off. This file ranks below operating system environment variables, so it does not hold against
      # an exported SPRING_AI_ANTHROPIC_API_KEY. IntegrationTestBase pins a blank key and a loopback base URL in a test
      # property source, which does. This file also covers contexts that do not extend that base.
      api-key: ""
