spring:
  application:
    name: bookstore
  docker:
    compose:
      # spring-boot:run starts compose.yaml and derives the datasource from the running container.
      # start-only keeps the database running across application restarts.
      lifecycle-management: start-only
      file: ./compose.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    anthropic:
      # The key comes only from BOOKSTORE_AI_API_KEY. Without it the assistant is offline and the application still
      # starts: the chat model is switched off and the assistant endpoint answers 503.
      api-key: ${BOOKSTORE_AI_API_KEY:}
      # Pinned on purpose: without this line the client library takes the API address from a shell variable, which
      # could send the workshop key to another host.
      base-url: https://api.anthropic.com
      chat:
        model: ${BOOKSTORE_AI_MODEL:claude-haiku-5-5}
        max-tokens: 1024
        # No sampling setting (temperature and the like) on purpose: current Claude models reject a request that
        # sets one with a 400, and leaving it out keeps the model's own default.

bookstore:
  assistant:
    max-requests-per-minute: 20
    max-message-length: 1000

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Lists each health component (db among them) with its status only; details such as the URL stay hidden.
      show-components: always
