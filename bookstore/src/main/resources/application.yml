spring:
  application:
    name: bookstore
  docker:
    compose:
      # spring-boot:run starts compose.yaml and derives the datasource from the running container.
      # start-only keeps the database running across application restarts.
      lifecycle-management: start-only
      file: ./compose.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # The schema migrations plus the demo data. Keep this a single comma separated value: the test profile replaces it
    # with the schema location only, so tests never see the demo data.
    locations: classpath:db/migration,classpath:db/seed

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Lists each health component (db among them) with its status only; details such as the URL stay hidden.
      show-components: always
